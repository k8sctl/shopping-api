apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopping-app
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: shopping-app
  namespaceSelector:
    matchNames:
      - shopping-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s